# Base: PostgreSQL, migraciones y Apache Airflow (imagen oficial). docker-compose.yml
# la incluye y suma la API y la web. Sola sirve para desarrollar con `pnpm dev`
# (API y web fuera de Docker):
#   cp .env.example .env   (la primera vez: puertos, usuarios y claves)
#   docker compose -f docker-compose.base.yml up -d
# Mismo proyecto (`pokemon`) que docker-compose.yml: comparten contenedores y volumen.
# Todos los valores vienen de .env; si falta uno, compose no arranca (${VAR:?}).
# Orden: postgres sano → migrate crea tablas y constraints → airflow (el DAG genera los
# CSV y los carga).
name: pokemon

# Base de la app dentro de la red de compose (la usan migrate y Airflow).
x-pokemon-db-url: &pokemon-db-url postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - '${POSTGRES_PORT:?}:5432'
    volumes:
      # Desde Postgres 18 el volumen va en /var/lib/postgresql (no en .../data).
      - postgres-data:/var/lib/postgresql
    configs:
      # Crea la base interna de Airflow (no carga datos). Solo corre con el volumen vacío.
      - source: airflow-db
        target: /docker-entrypoint-initdb.d/10-airflow-db.sql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    # Aplica las migraciones de Prisma (db/main) y termina. Idempotente.
    build:
      context: .
      dockerfile: db/main/Dockerfile
    environment:
      DATABASE_URL: *pokemon-db-url
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    image: apache/airflow:3.3.2
    # Con el uid del dueño de ./data (grupo 0, como pide la imagen oficial) para que
    # el DAG pueda escribir ahí los CSV.
    user: '${AIRFLOW_UID:?}:0'
    # standalone: migra su base y corre UI/API, scheduler, dag-processor y triggerer
    # en un solo contenedor (el modo de Airflow para desarrollo local).
    # Antes escribe la clave del usuario admin: Airflow necesita ese archivo con
    # permiso de escritura (lo usa como lock), así que no puede montarse.
    command:
      - bash
      - -c
      - |
        echo '{"${AIRFLOW_ADMIN_USERNAME:?}": "${AIRFLOW_ADMIN_PASSWORD:?}"}' > /opt/airflow/passwords.json
        exec airflow standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?}:${AIRFLOW_DB_PASSWORD:?}@postgres/${AIRFLOW_DB_NAME:?}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USERNAME:?}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?}
      # Retomar rápido una tarea interrumpida (se reintenta solo esa; las anteriores ya
      # terminaron). Si se cae todo Airflow, al volver la tarea queda huérfana y el
      # scheduler la resetea en su próximo chequeo; si muere solo el proceso de la tarea,
      # se da por muerta tras 60 s sin heartbeat. Con los defaults (300 s) tardaba 5 min.
      AIRFLOW__SCHEDULER__ORPHANED_TASKS_CHECK_INTERVAL: '60'
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: '60'
      # Conexión `pokemon_db` a la base de la app: con ella el DAG carga y crea las vistas.
      AIRFLOW_CONN_POKEMON_DB: *pokemon-db-url
    ports:
      - '${AIRFLOW_PORT:?}:8080'
    volumes:
      - ./platform/airflow/dags:/opt/airflow/dags
      # Los CSV de cada corrida (data/runs/<run_id>/): los escriben las tareas extract
      # y generate del DAG y los leen validate y load.
      - ./data:/opt/airflow/data
      # El generador del desafío, que corre la tarea generate.
      - ./scripts:/opt/airflow/scripts:ro
      # Definición de las vistas (fuente única, la lee también el context). La ejecuta build_views.
      - ./db/main/sql:/opt/airflow/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD', 'curl', '--fail', 'http://localhost:8080/api/v2/monitor/health']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

configs:
  airflow-db:
    content: |
      CREATE USER ${AIRFLOW_DB_USER:?} WITH PASSWORD '${AIRFLOW_DB_PASSWORD:?}';
      CREATE DATABASE ${AIRFLOW_DB_NAME:?} OWNER ${AIRFLOW_DB_USER:?};

volumes:
  postgres-data:

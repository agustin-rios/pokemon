# Producción: lo de docker-compose.yml (Postgres, migraciones y Airflow) más la API
# y la web en contenedores. La web (nginx) sirve la SPA y reenvía /api a la API.
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml down
# Proyecto aparte (`pokemon-prod`, con su propio volumen de datos). Publica los
# mismos puertos que dev: no se levantan los dos a la vez.
# Los valores vienen del mismo .env (también WEB_PORT y API_CORS_ALLOW_ORIGINS).
name: pokemon-prod

include:
  - docker-compose.yml

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Sin puerto publicado: se llega por la web (/api). NODE_ENV=production viene de la imagen.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      CORS_ALLOW_ORIGINS: ${API_CORS_ALLOW_ORIGINS:?}
      AIRFLOW_URL: http://airflow:8080
      AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/pokemon/Dockerfile
    ports:
      - '${WEB_PORT:?}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# Backend en Rust. Cada crate vive en el mismo directorio que su equivalente
# TypeScript (libs/, db/, context/, apps/).
[workspace]
resolver = "3"
members = [
    "libs/pokemon-data",
    "db/main",
    "context/pokedex",
    "context/ingestion",
    "apps/api",
    "apps/worker",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "10", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
dotenvy = "0.15"
async-trait = "0.1"
# Solo para tests
sha2 = "0.10"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[workspace.lints.clippy]
# Un fallo en runtime se propaga como error; unwrap solo se permite en tests.
unwrap_used = "deny"

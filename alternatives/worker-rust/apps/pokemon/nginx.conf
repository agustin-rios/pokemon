# nginx de la imagen de producción de la web (apps/pokemon/Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api → servicio `api` de compose. Con el DNS de Docker y una variable, nginx
    # resuelve el nombre en cada request: arranca aunque la API no esté arriba y
    # sigue a la API si se reinicia con otra IP.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con hash en el nombre (vite build): se cachean para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta devuelve index.html y la resuelve React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

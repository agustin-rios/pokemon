# Todo el proyecto: lo de docker-compose.base.yml (Postgres, Redis y migraciones) más la
# API, el worker y la web en contenedores. La web (nginx) sirve la SPA y reenvía /api a la API.
#   cp .env.example .env   (la primera vez)
#   docker compose up -d --build
#   docker compose down
# Los valores vienen de .env (aquí también WEB_PORT y API_CORS_ALLOW_ORIGINS).
name: pokemon-worker-ts

include:
  - docker-compose.base.yml

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Sin puerto publicado: se llega por la web (/api). NODE_ENV=production viene de la imagen.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379
      CORS_ALLOW_ORIGINS: ${API_CORS_ALLOW_ORIGINS:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379
      # POKEAPI_URL, POKEMON_LIMIT y LOCK_DURATION_MS usan sus defaults
      # (ver apps/worker/.env.example).
    # El worker espera hasta 10 s al paso en curso al apagarse: Docker debe esperar más
    # antes de enviar SIGKILL (por defecto también 10 s).
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/pokemon/Dockerfile
    ports:
      - '${WEB_PORT:?}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

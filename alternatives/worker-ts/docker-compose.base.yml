# Base: PostgreSQL, Redis y migraciones. docker-compose.yml la incluye y suma la API, el
# worker y la web. Sola sirve para desarrollar con `pnpm dev` (API, worker y web
# fuera de Docker):
#   cp .env.example .env   (la primera vez: puertos, usuarios y claves)
#   docker compose -f docker-compose.base.yml up -d
# Mismo proyecto (`pokemon-worker-ts`) que docker-compose.yml: comparten contenedores y volumen.
# Todos los valores vienen de .env; si falta uno, compose no arranca (${VAR:?}).
# Orden: postgres sano → migrate crea tablas, constraints y el esquema staging → el worker
# (con Redis sano, donde vive la cola de corridas) carga los datos.
name: pokemon-worker-ts

# Base de la app dentro de la red de compose (la usan migrate, la API y el worker).
x-pokemon-db-url: &pokemon-db-url postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - '${POSTGRES_PORT:?}:5432'
    volumes:
      # Desde Postgres 18 el volumen va en /var/lib/postgresql (no en .../data).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    # La cola de corridas del ETL (BullMQ). appendonly: las corridas sobreviven a un reinicio.
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:?}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    # Aplica las migraciones de Prisma (db/main: tablas de la app y esquema staging) y termina. Idempotente.
    build:
      context: .
      dockerfile: db/main/Dockerfile
    environment:
      DATABASE_URL: *pokemon-db-url
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
